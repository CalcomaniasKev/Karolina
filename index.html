<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ Feliz Cumpleaños ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
    overflow:hidden;
}

.container{
    text-align:center;
    animation:fadeIn 2s ease;
    padding:20px;
}

h1{
    color:white;
    font-size:3rem;
    margin-bottom:10px;
    text-shadow:0 0 15px rgba(255,255,255,0.7);
}

p{
    color:white;
    font-size:1.3rem;
    margin-bottom:30px;
}

.buttons{
    display:none;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
    animation:appear 1.5s ease;
}

button{
    border:none;
    padding:15px 30px;
    font-size:1rem;
    border-radius:30px;
    cursor:pointer;
    transition:0.4s;
    color:white;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(10px);
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

button:hover{
    transform:translateY(-5px) scale(1.05);
    background:rgba(255,255,255,0.35);
}

.video-container{
    margin-top:30px;
    animation:fadeIn 1s ease;
}

video{
    width:90%;
    max-width:700px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(255,255,255,0.5);
}

.heart{
    position:absolute;
    color:white;
    animation:float 6s linear infinite;
    font-size:20px;
    opacity:0.7;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes float{
    0%{
        transform:translateY(100vh);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    100%{
        transform:translateY(-10vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>❤️ Te quiero mucho ❤️</h1>
    <p>Este regalo fue hecho especialmente para ti 🎂✨</p>

    <div class="buttons" id="buttons">
        <button onclick="playVideo('mananitas.mp4')">
            🎵 Ver Mañanitas
        </button>

        <button onclick="playVideo('pato.mp4')">
            🦆 Ver Pato
        </button>
    </div>

    <div class="video-container" id="videoContainer"></div>

</div>

<script>

// Mostrar botones con transición bonita
setTimeout(() => {
    document.getElementById("buttons").style.display = "flex";
}, 2500);

// Reproducir video
function playVideo(file){
    document.getElementById("videoContainer").innerHTML = `
        <video controls autoplay>
            <source src="${file}" type="video/mp4">
            Tu navegador no soporta video.
        </video>
    `;
}

// Corazones flotando
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = Math.random()*25 + 15 + "px";
    heart.style.animationDuration = Math.random()*3 + 4 + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);
}

setInterval(createHeart, 300);

</script>

</body>
</html>
