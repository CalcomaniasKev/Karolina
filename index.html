<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ Feliz Cumpleaños ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffc3a0);
    overflow:hidden;
}

.container{
    text-align:center;
    padding:20px;
    z-index:2;
    animation:fadeIn 2s ease;
}

h1{
    color:white;
    font-size:3rem;
    text-shadow:0 0 20px rgba(255,255,255,.8);
    margin-bottom:15px;
}

p{
    color:white;
    font-size:1.3rem;
    margin-bottom:30px;
}

.buttons{
    display:none;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    animation:showButtons 1.5s ease;
}

button{
    border:none;
    outline:none;
    padding:15px 30px;
    border-radius:40px;
    cursor:pointer;
    color:white;
    font-size:1rem;
    background:rgba(255,255,255,.2);
    backdrop-filter:blur(10px);
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    transition:.4s;
}

button:hover{
    transform:translateY(-5px) scale(1.05);
    background:rgba(255,255,255,.35);
}

.video-container{
    margin-top:30px;
    animation:fadeIn 1s ease;
}

video{
    width:90%;
    max-width:700px;
    border-radius:25px;
    box-shadow:0 0 30px rgba(255,255,255,.5);
}

.heart{
    position:absolute;
    color:white;
    animation:float 6s linear infinite;
    opacity:.7;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes showButtons{
    from{
        opacity:0;
        transform:scale(.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes float{
    0%{
        transform:translateY(100vh);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    100%{
        transform:translateY(-10vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>❤️ Te quiero mucho ❤️</h1>

<p>Este regalo fue hecho especialmente para ti 🎂✨</p>

<div class="buttons" id="buttons">

<button onclick="playVideo('mananitas.mp4')">
🎵 Ver Mañanitas
</button>

<button onclick="playVideo('pato.mp4')">
🦆 Ver Pato
</button>

</div>

<div class="video-container" id="videoContainer"></div>

</div>

<script>

// Botones aparecen después del mensaje
setTimeout(()=>{
    document.getElementById("buttons").style.display="flex";
},2500);

// Reproducir video
function playVideo(video){
    document.getElementById("videoContainer").innerHTML = `
        <video controls autoplay>
            <source src="${video}" type="video/mp4">
        </video>
    `;
}

// Corazones animados
function createHeart(){

    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(15+Math.random()*25)+"px";
    heart.style.animationDuration=(4+Math.random()*3)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);
}

setInterval(createHeart,300);

</script>

</body>
</html>
