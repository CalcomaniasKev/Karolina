<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Feliz Cumpleaños 🎂</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ffc3a0,#ffd6e0);
background-size:400% 400%;
animation:fondo 12s ease infinite;
}

/* Fondo animado */
@keyframes fondo{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Tarjeta */
.card{
width:90%;
max-width:700px;
padding:50px;
border-radius:35px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(18px);
box-shadow:0 10px 40px rgba(0,0,0,.2);
text-align:center;
color:white;
z-index:10;
animation:entrada 2s ease;
}

@keyframes entrada{
from{
opacity:0;
transform:translateY(40px) scale(.9);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

h1{
font-size:3rem;
margin-bottom:20px;
text-shadow:0 0 25px rgba(255,255,255,.9);
animation:glow 3s infinite alternate;
}

@keyframes glow{
from{
text-shadow:0 0 15px white;
}
to{
text-shadow:0 0 35px white,0 0 60px pink;
}
}

p{
font-size:1.25rem;
line-height:1.9;
margin-top:15px;
opacity:0;
animation:texto 2s forwards;
animation-delay:1s;
}

@keyframes texto{
to{
opacity:1;
}
}

/* Botón */
button{
margin-top:35px;
padding:15px 35px;
border:none;
border-radius:40px;
background:white;
color:#ff4f81;
font-size:1rem;
font-weight:bold;
cursor:pointer;
transition:.4s;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

button:hover{
transform:scale(1.08);
}

/* Corazones */
.heart{
position:absolute;
font-size:20px;
animation:flotar linear infinite;
opacity:.7;
pointer-events:none;
}

@keyframes flotar{
0%{
transform:translateY(100vh);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-10vh);
opacity:0;
}
}

/* Estrellas */
.star{
position:absolute;
font-size:18px;
animation:subir linear infinite;
opacity:.8;
pointer-events:none;
}

@keyframes subir{
0%{
transform:translateY(100vh) rotate(0);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-10vh) rotate(360deg);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card">

<h1>🎂 Feliz Cumpleaños 🎂</h1>

<p id="mensaje">
Hoy es un día muy especial ✨<br><br>

Porque celebra la existencia de una persona increíble 💖<br><br>

Que la vida te regale alegría, sueños cumplidos y momentos inolvidables 🌸💫
</p>

<button onclick="mostrarMensaje()">
💌 Abrir sorpresa 💌
</button>

</div>

<script>

function mostrarMensaje(){
document.getElementById("mensaje").innerHTML=
`
💖 Para alguien muy especial 💖<br><br>

Que nunca te falten sonrisas, abrazos sinceros y personas que te quieran bonito ✨<br><br>

Disfruta tu día y guarda cada momento como un recuerdo hermoso 🎉🌷
`;
}

// Corazones
function crearCorazon(){
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*25)+"px";
heart.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);
}

// Estrellas
function crearEstrella(){
const star=document.createElement("div");
star.className="star";
star.innerHTML="✨";
star.style.left=Math.random()*100+"vw";
star.style.fontSize=(10+Math.random()*25)+"px";
star.style.animationDuration=(5+Math.random()*4)+"s";

document.body.appendChild(star);

setTimeout(()=>{
star.remove();
},9000);
}

setInterval(crearCorazon,400);
setInterval(crearEstrella,700);

</script>

</body>
</html>
