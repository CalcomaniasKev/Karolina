```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorpresa</title>

<style>

body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:350px;
    background:#111;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px red;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:20px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:red;
    color:white;
    margin-top:15px;
    font-size:16px;
    cursor:pointer;
}

video{
    width:100%;
    margin-top:20px;
    border-radius:15px;
}

</style>
</head>

<body>

<div class="card" id="card">

    <h1>🎁 Sorpresa</h1>

    <input type="text" id="nombre" placeholder="Escribe tu nombre">

    <button onclick="mostrarSorpresa()">
        Ver sorpresa
    </button>

</div>

<script>

function mostrarSorpresa(){

    const nombre = document.getElementById("nombre").value;

    if(nombre === ""){
        alert("Escribe tu nombre");
        return;
    }

    document.getElementById("card").innerHTML = `

        <h1>❤️ ${nombre} ❤️</h1>

        <p>
        ❤️ Te quiero mucho ❤️
        <br><br>
        Este regalo fue hecho especialmente para ti ✨
        </p>

        <button onclick="mostrarVideo1()">
            Ver primera sorpresa 🎥
        </button>

        <div id="video1Container" style="display:none;">

            <video id="video1" controls>
                <source src="mananitas.mp4" type="video/mp4">
            </video>

            <button 
            id="btn2"
            onclick="mostrarVideo2()"
            style="display:none;"
            >
                Ver segunda sorpresa ❤️
            </button>

        </div>

        <div id="video2Container" style="display:none;">

            <video id="video2" controls>
                <source src="pato.mp4" type="video/mp4">
            </video>

        </div>

    `;

}

function mostrarVideo1(){

    document.getElementById("video1Container").style.display = "block";

    const video1 = document.getElementById("video1");

    video1.play();

    video1.onended = function(){

        document.getElementById("btn2").style.display = "block";

    };

}

function mostrarVideo2(){

    document.getElementById("video2Container").style.display = "block";

    document.getElementById("video2").play();

}

</script>

</body>
</html>
```
