<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sorpresa Especial</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:black;
      position:relative;
    }

    /* Fondo rojo neón */

    body::before{
      content:"";
      position:absolute;
      width:600px;
      height:600px;
      background:red;
      filter:blur(180px);
      opacity:0.35;
      top:-150px;
      left:-150px;
    }

    body::after{
      content:"";
      position:absolute;
      width:500px;
      height:500px;
      background:#ff0000;
      filter:blur(170px);
      opacity:0.25;
      bottom:-180px;
      right:-180px;
    }

    .card{
      width:350px;
      background:#070707;
      border-radius:25px;
      padding:30px;
      position:relative;
      z-index:10;
      border:1px solid rgba(255,0,0,0.4);
      box-shadow:0 0 30px rgba(255,0,0,0.4);
      animation:entrada 1s ease;
      overflow:hidden;
    }

    .barra{
      width:100%;
      height:12px;
      background:#1f1f1f;
      border-radius:20px;
      margin-bottom:30px;
      position:relative;
    }

    .barra::before{
      content:"";
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      background:#ff3b3b;
      top:1px;
      left:10px;
    }

    .barra::after{
      content:"";
      position:absolute;
      width:10px;
      height:10px;
      border-radius:50%;
      background:#ffcc00;
      top:1px;
      left:28px;
    }

    h1{
      color:white;
      text-align:center;
      margin-bottom:20px;
      font-size:38px;
    }

    .typing{
      color:#ff3b3b;
      text-align:center;
      margin-bottom:20px;
      min-height:30px;
      font-size:17px;
    }

    input{
      width:100%;
      padding:15px;
      border:none;
      border-radius:15px;
      background:#1a1a1a;
      color:white;
      outline:none;
      margin-bottom:18px;
      font-size:15px;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:15px;
      background:linear-gradient(90deg,#ff0000,#ff4040);
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.03);
      box-shadow:0 0 25px red;
    }

    .final{
      text-align:center;
      animation:fade 1s ease;
    }

    .final h2{
      color:#ff2b2b;
      font-size:45px;
      margin-bottom:20px;
      text-shadow:0 0 20px red;
    }

    .final p{
      color:white;
      font-size:20px;
      line-height:1.6;
    }

    .gif{
      width:200px;
      margin-top:25px;
      border-radius:20px;
      box-shadow:0 0 20px rgba(255,0,0,0.5);
    }

    @keyframes entrada{
      from{
        opacity:0;
        transform:translateY(40px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:scale(0.8);
      }

      to{
        opacity:1;
        transform:scale(1);
      }
    }

  </style>
</head>

<body>

  <div class="card" id="card">

    <div class="barra"></div>

    <h1>🎁</h1>

    <div class="typing" id="typing"></div>

    <input type="text" id="nombre" placeholder="Escribe tu nombre...">

    <button onclick="mostrarSorpresa()">
      Ver sorpresa
    </button>

  </div>

  <script>

    const texto = "Hay algo especial preparado para ti ❤️";
    let i = 0;

    function escribir(){

      if(i < texto.length){

        document.getElementById("typing").innerHTML += texto.charAt(i);

        i++;

        setTimeout(escribir,60);

      }

    }

    escribir();

    function mostrarSorpresa(){

      const nombre = document.getElementById("nombre").value;

      if(nombre.trim() === ""){

        alert("Escribe tu nombre");

        return;

      }

      document.getElementById("card").innerHTML = `

        <div class="final">

          <h2>❤️ ${nombre} ❤️</h2>

          <p>
            Eres una persona muy especial ✨
            <br><br>
            Nunca olvides lo increíble que eres ❤️
          </p>

          <img 
            class="gif"
            src="https://media.tenor.com/Wz9gK1JpL1AAAAAM/love.gif"
          >

        </div>

      `;

    }

  </script>

</body>
</html>
