<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorpresa Especial</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    position:relative;
}

/* Fondo neon */

body::before{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    background:red;
    filter:blur(180px);
    opacity:0.35;
    top:-250px;
    left:-250px;
}

body::after{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    background:#ff0000;
    filter:blur(180px);
    opacity:0.25;
    bottom:-250px;
    right:-250px;
}

.card{
    width:360px;
    background:#080808;
    border-radius:25px;
    padding:30px;
    position:relative;
    z-index:5;
    border:1px solid rgba(255,0,0,0.4);
    box-shadow:0 0 30px rgba(255,0,0,0.4);
    animation:entrada 1s ease;
    overflow:hidden;
}

.barra{
    width:100%;
    height:12px;
    background:#1f1f1f;
    border-radius:20px;
    margin-bottom:30px;
    position:relative;
}

.barra::before{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ff3b3b;
    top:1px;
    left:10px;
}

.barra::after{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ffcc00;
    top:1px;
    left:28px;
}

.titulo{
    color:white;
    text-align:center;
    font-size:45px;
    margin-bottom:20px;
}

.typing{
    color:#ff3b3b;
    text-align:center;
    margin-bottom:20px;
    min-height:30px;
    font-size:17px;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#1a1a1a;
    color:white;
    outline:none;
    margin-bottom:18px;
    font-size:15px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:linear-gradient(90deg,#ff0000,#ff4040);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.03);
    box-shadow:0 0 25px red;
}

.final{
    text-align:center;
    animation:fade 1s ease;
}

.final h2{
    color:#ff2b2b;
    font-size:45px;
    margin-bottom:20px;
    text-shadow:0 0 20px red;
}

.final p{
    color:white;
    font-size:20px;
    line-height:1.6;
}

video{
    width:100%;
    border-radius:20px;
    margin-top:20px;
    box-shadow:0 0 20px rgba(255,0,0,0.5);
    animation:videoFade 1s ease;
}

.oculto{
    display:none;
}

@keyframes entrada{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes fade{

    from{
        opacity:0;
        transform:scale(0.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

@keyframes videoFade{

    from{
        opacity:0;
        transform:scale(0.9);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

</style>
</head>

<body>

<div class="card" id="card">

    <div class="barra"></div>

    <div class="titulo">🎁</div>

    <div class="typing" id="typing"></div>

    <input type="text" id="nombre" placeholder="Escribe tu nombre...">

    <button onclick="mostrarSorpresa()">
        Ver sorpresa
    </button>

</div>

<script>

const texto = "Hay algo especial preparado para ti ❤️";

let i = 0;

function escribir(){

    if(i < texto.length){

        document.getElementById("typing").innerHTML += texto.charAt(i);

        i++;

        setTimeout(escribir,60);

    }

}

escribir();

function escribirNombre(texto, elemento, velocidad = 120){

    let i = 0;

    elemento.innerHTML = "";

    function typing(){

        if(i < texto.length){

            elemento.innerHTML += texto.charAt(i);

            i++;

            setTimeout(typing, velocidad);

        }

    }

    typing();

}

function mostrarSorpresa(){

    const nombre = document.getElementById("nombre").value;

    if(nombre.trim() === ""){

        alert("Escribe tu nombre");

        return;

    }

    document.getElementById("card").innerHTML = `

        <div class="final">

            <h2 id="nombreAnimado"></h2>

            <p>
                ❤️ Te quiero mucho ❤️
                <br><br>
                Este regalo fue hecho especialmente para ti ✨
            </p>

            <video id="video1" autoplay controls>
                <source src="mananitas.mp4" type="video/mp4">
            </video>

            <video id="video2" class="oculto" autoplay controls>
                <source src="pato.mp4" type="video/mp4">
            </video>

        </div>

    `;

    escribirNombre("❤️ " + nombre + " ❤️", document.getElementById("nombreAnimado"));

    const video1 = document.getElementById("video1");
    const video2 = document.getElementById("video2");

    /* Cuando termina el primer video */

    video1.onended = function(){

        video1.classList.add("oculto");

        video2.classList.remove("oculto");

        video2.play();

    };

}

</script>

</body>
</html>
