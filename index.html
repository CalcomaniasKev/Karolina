<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Feliz Cumpleaños 🎂</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ffd3a5,#fd6585);
    background-size:400% 400%;
    animation:fondo 12s ease infinite;
}

.container{
    text-align:center;
    color:white;
    z-index:2;
    padding:30px;
}

h1{
    font-size:3rem;
    animation:entrada 2s ease;
    text-shadow:0 0 15px rgba(255,255,255,.8);
}

p{
    margin-top:15px;
    font-size:1.3rem;
    animation:entrada 3s ease;
}

button{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:35px;
    font-size:1rem;
    cursor:pointer;
    background:white;
    color:#ff4f81;
    transition:.4s;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

button:hover{
    transform:scale(1.08);
}

.heart{
    position:absolute;
    color:white;
    animation:subir linear infinite;
    opacity:.7;
}

@keyframes fondo{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

@keyframes entrada{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes subir{
    0%{
        transform:translateY(100vh);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    100%{
        transform:translateY(-10vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>🎂 ¡Feliz Cumpleaños! 🎂</h1>
    <p id="mensaje">
        Hoy es un día muy especial ✨<br>
        Deseo que tu vida esté llena de alegría, amor y sueños cumplidos 💖
    </p>

    <button onclick="cambiarMensaje()">
        ❤️ Abrir sorpresa ❤️
    </button>
</div>

<script>

function cambiarMensaje(){
    document.getElementById("mensaje").innerHTML=
    "💖 Gracias por existir 💖<br><br>Que este cumpleaños esté lleno de sonrisas, amor y momentos inolvidables ✨🎉";
}

// Corazones flotando
function crearCorazon(){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(15+Math.random()*30)+"px";
    heart.style.animationDuration=(4+Math.random()*4)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },8000);
}

setInterval(crearCorazon,300);

</script>

</body>
</html>
