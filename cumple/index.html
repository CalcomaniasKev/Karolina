<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ Feliz Cumpleaños ✨</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:#0f172a;
position:relative;
}

/* Fondo blur */
body::before{
content:"";
position:absolute;
width:600px;
height:600px;
background:linear-gradient(#ff4fa3,#7c3aed);
filter:blur(180px);
opacity:.4;
animation:move 8s infinite alternate;
}

@keyframes move{
from{
transform:translate(-100px,-50px);
}
to{
transform:translate(100px,80px);
}
}

/* Partículas */
.star{
position:absolute;
color:white;
opacity:.4;
animation:float linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-10vh);
opacity:0;
}
}

/* Card */
.card{
position:relative;
z-index:2;
width:90%;
max-width:720px;
padding:55px;
border-radius:35px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.12);
backdrop-filter:blur(20px);
box-shadow:
0 10px 40px rgba(0,0,0,.35),
0 0 40px rgba(255,79,163,.15);
text-align:center;
animation:show 1.8s ease;
}

@keyframes show{
from{
opacity:0;
transform:translateY(50px) scale(.92);
}
to{
opacity:1;
transform:none;
}
}

h1{
font-size:3.2rem;
color:white;
margin-bottom:20px;
font-weight:700;
letter-spacing:1px;
}

.gradient{
background:linear-gradient(90deg,#ff6ac1,#c084fc);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

p{
color:#e2e8f0;
font-size:1.2rem;
line-height:2;
margin-top:10px;
opacity:.9;
}

button{
margin-top:35px;
padding:16px 35px;
border:none;
border-radius:18px;
background:linear-gradient(90deg,#ff4fa3,#8b5cf6);
color:white;
font-size:1rem;
font-weight:600;
cursor:pointer;
transition:.35s;
box-shadow:0 8px 25px rgba(255,79,163,.35);
}

button:hover{
transform:translateY(-3px);
box-shadow:0 12px 35px rgba(255,79,163,.5);
}

.small{
margin-top:18px;
font-size:.95rem;
color:#94a3b8;
}
</style>
</head>
<body>

<div class="card">

<h1>
🎂 <span class="gradient">Feliz Cumpleaños</span> 🎂
</h1>

<p id="texto">
Hoy no es un día cualquiera ✨<br><br>

Es el comienzo de otro año lleno de sueños, risas y momentos bonitos 💖<br><br>

Que la vida te abrace con alegría y que nunca pierdas esa luz especial 🌷
</p>

<button onclick="abrir()">
💌 Abrir Mensaje
</button>

<div class="small">
hecho con cariño ✨
</div>

</div>

<script>

function abrir(){
document.getElementById("texto").innerHTML=
`
💖 Para alguien muy especial 💖<br><br>

Que este cumpleaños te regale felicidad, abrazos sinceros y recuerdos inolvidables ✨<br><br>

Nunca olvides lo valiosa y maravillosa que eres 🌸🎉
`;
}

function star(){
let s=document.createElement("div");
s.className="star";
s.innerHTML=Math.random()>.5?"✨":"💖";
s.style.left=Math.random()*100+"vw";
s.style.fontSize=(10+Math.random()*25)+"px";
s.style.animationDuration=(4+Math.random()*6)+"s";

document.body.appendChild(s);

setTimeout(()=>{
s.remove();
},10000);
}

setInterval(star,300);

</script>

</body>
</html>
